[package]
name = "openai-rs"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "An independent Rust SDK for the OpenAI API"
readme = "README.md"
homepage = "https://github.com/ChimeWu/openai-rs"
repository = "https://github.com/ChimeWu/openai-rs"
documentation = "https://docs.rs/openai-rs/0.2.0"

[workspace]
members = ["crates/openai-api-types"]
resolver = "3"

[lib]
name = "openai_rs"
path = "src/lib.rs"
doctest = false

[[example]]
name = "audio"
required-features = ["multipart"]

[[example]]
name = "uploads"
required-features = ["multipart"]

[[example]]
name = "vector_stores"

[[example]]
name = "fine_tuning"

[[example]]
name = "images"

[[example]]
name = "websockets"
required-features = ["websocket"]

[[example]]
name = "live_websocket"
required-features = ["websocket"]

[[example]]
name = "realtime_websocket"
required-features = ["websocket"]

[features]
live-api = []
multipart = []
websocket = ["dep:tokio-tungstenite"]
full-protocol-types = ["openai-api-types/full"]

[dependencies]
openai-api-types = { path = "crates/openai-api-types", version = "0.1.0", default-features = false, features = ["audio", "batches", "chat_completions", "containers", "content_provenance", "conversations", "embeddings", "files", "fine_tuning", "images", "live", "models", "moderations", "realtime", "responses", "uploads", "vector_stores", "webhooks"] }
async-stream = "0.3"
bytes = "1"
eventsource-stream = "0.2"
futures-core = "0.3"
futures-util = "0.3"
regress = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"], optional = true }
url = "2"

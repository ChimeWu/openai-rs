full = ["components", "common", "agents", "assistants", "audio", "audit_logs", "batches", "certificates", "chat_completions", "chatkit", "completions", "containers", "content_provenance", "conversations", "data_retention", "decisions", "embeddings", "evals", "files", "fine_tuning", "group_organization_role_assignments", "group_users", "groups", "hosted_tools", "images", "invites", "live", "models", "moderations", "project_group_role_assignments", "project_groups", "project_user_role_assignments", "projects", "realtime", "responses", "roles", "safety", "skills", "spend_alerts", "uncategorized", "uploads", "usage", "user_organization_role_assignments", "users", "vaults", "vector_stores", "videos", "webhooks"]

[dependencies]
